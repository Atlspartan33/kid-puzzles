<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Puzzle Time</title>
<meta name="description" content="Jigsaw puzzles for Tori and TJ — works offline.">
<meta name="theme-color" content="#121A2E">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Puzzles">
<link rel="stylesheet" href="styles.css">
</head>
<body data-kid="tori">

<!-- HOME -->
<main id="home" class="screen">
  <header class="home-top">
    <h1 class="brand"><span>Puzzle</span><span class="brand-2">Time</span></h1>
    <div class="top-actions">
      <button id="installBtn" class="pill" hidden>Install app</button>
      <button id="soundBtn" class="icon-btn" aria-pressed="true" aria-label="Sound is on">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path class="snd-on" d="M4 9v6h4l5 4V5L8 9H4zm12.5 3a4.5 4.5 0 0 0-2.5-4v8a4.5 4.5 0 0 0 2.5-4zM14 3.2v2.1a7 7 0 0 1 0 13.4v2.1a9 9 0 0 0 0-17.6z"/><path class="snd-off" d="M4 9v6h4l5 4V5L8 9H4zm12.6 3 2.7-2.7-1.4-1.4-2.7 2.7-2.7-2.7-1.4 1.4 2.7 2.7-2.7 2.7 1.4 1.4 2.7-2.7 2.7 2.7 1.4-1.4z"/></svg>
      </button>
    </div>
  </header>

  <section class="who">
    <h2 class="label" id="whoLabel">Who's playing?</h2>
    <div class="kids" role="radiogroup" aria-labelledby="whoLabel">
      <button class="kid kid-tori" role="radio" aria-checked="true" data-kid="tori">
        <span class="kid-face" aria-hidden="true">👧🏾</span>
        <span class="kid-name">Tori</span>
        <span class="kid-sub">12 · 24 · 48 pieces</span>
      </button>
      <button class="kid kid-tj" role="radio" aria-checked="false" data-kid="tj">
        <span class="kid-face" aria-hidden="true">👦🏾</span>
        <span class="kid-name">TJ</span>
        <span class="kid-sub">4 · 6 · 9 pieces</span>
      </button>
    </div>
  </section>

  <section class="pics">
    <h2 class="label">Pick a picture</h2>
    <div id="gallery" class="gallery"></div>
    <input id="fileInput" type="file" accept="image/*" multiple hidden>
  </section>
</main>

<!-- PLAY -->
<section id="play" class="screen" hidden>
  <header class="play-top">
    <button id="backBtn" class="icon-btn big" aria-label="Back to pictures">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15.4 4.6 8 12l7.4 7.4-1.8 1.8L4.4 12l9.2-9.2z"/></svg>
    </button>
    <div class="progress" aria-hidden="true">
      <div class="progress-bar"><div id="progressFill" class="progress-fill"></div></div>
      <div id="progressText" class="progress-text">0 / 0</div>
    </div>
    <div id="playTools" class="play-actions">
      <button id="tidyBtn" class="icon-btn big" aria-label="Spread out the pieces">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 3h7v7H3zm11 0h7v7h-7zM3 14h7v7H3zm11 0h7v7h-7z"/></svg>
      </button>
      <button id="ghostBtn" class="icon-btn big" aria-pressed="false" aria-label="Picture helper">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5C6.5 5 2.7 9.4 1.5 12c1.2 2.6 5 7 10.5 7s9.3-4.4 10.5-7C21.3 9.4 17.5 5 12 5zm0 11.5a4.5 4.5 0 1 1 0-9 4.5 4.5 0 0 1 0 9zm0-2.3a2.2 2.2 0 1 0 0-4.4 2.2 2.2 0 0 0 0 4.4z"/></svg>
      </button>
      <button id="hintBtn" class="icon-btn big accent" aria-label="Show me a piece">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 21h6v-1.5H9V21zm3-19a7 7 0 0 0-4 12.7V17a1 1 0 0 0 1 1h6a1 1 0 0 0 1-1v-2.3A7 7 0 0 0 12 2z"/></svg>
      </button>
    </div>
  </header>
  <div id="stage" class="stage">
    <div id="board" class="board"><canvas id="boardCanvas"></canvas></div>
    <div id="fx" class="fx"></div>
  </div>
  <div id="winPanel" class="win" hidden>
    <div class="win-star" aria-hidden="true">★</div>
    <p id="winText" class="win-text">You did it!</p>
    <div class="win-actions">
      <button id="againBtn" class="btn primary">Play again</button>
      <button id="newBtn" class="btn">New picture</button>
    </div>
  </div>
  <canvas id="confetti" class="confetti" aria-hidden="true"></canvas>
</section>

<!-- SIZE SHEET -->
<div id="sizeSheet" class="modal" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="sizeTitle">
    <button id="sizeClose" class="icon-btn close" aria-label="Close">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M18.3 5.7 16.9 4.3 12 9.2 7.1 4.3 5.7 5.7 10.6 10.6 5.7 15.5l1.4 1.4 4.9-4.9 4.9 4.9 1.4-1.4-4.9-4.9z"/></svg>
    </button>
    <img id="sizeThumb" class="sheet-thumb" alt="">
    <h2 id="sizeTitle" class="sheet-title">How many pieces?</h2>
    <div id="sizeOpts" class="size-opts"></div>
    <button id="ghostSwitch" class="switch" role="switch" aria-checked="false">
      <span class="switch-track"><span class="switch-knob"></span></span>
      <span class="switch-label">Picture helper<small>Shows a faint picture on the board</small></span>
    </button>
  </div>
</div>

<!-- CONFIRM -->
<div id="confirm" class="modal" hidden>
  <div class="sheet small" role="alertdialog" aria-modal="true" aria-labelledby="confirmTitle">
    <h2 id="confirmTitle" class="sheet-title">Stop this puzzle?</h2>
    <div class="confirm-actions">
      <button id="confirmKeep" class="btn primary">Keep playing</button>
      <button id="confirmGo" class="btn">Stop</button>
    </div>
  </div>
</div>

<div id="toast" class="toast" role="status" aria-live="polite"></div>
<div id="sr" class="sr-only" aria-live="polite"></div>

<script type="module" src="app.js"></script>
</body>
</html>
